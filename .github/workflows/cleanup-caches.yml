name: Cleanup PR caches

on:
  pull_request:
    types:
      - closed
  # Fork PRs get a read-only token, so a daily run deletes their caches
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: Delete caches for the closed PR
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      actions: write # delete the PR branch caches

    steps:
      - name: Delete caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache delete --all --ref "${BRANCH}" --succeed-on-no-caches

  cleanup-closed:
    name: Delete caches of closed PRs
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.event_name != 'pull_request'

    permissions:
      actions: write # delete the caches
      pull-requests: read # tell open PRs from closed ones

    steps:
      - name: Delete caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs=$(gh cache list --limit 1000 --json ref \
            --jq '[.[].ref | capture("^refs/pull/(?<pr>[0-9]+)/merge$").pr] | unique[]')
          for pr in ${prs}; do
            state=$(gh pr view "${pr}" --json state --jq .state)
            if [[ "${state}" != OPEN ]]; then
              # closed or merged pull request
              echo "PR ${pr} is ${state}: deleting caches for refs/pull/${pr}/merge"
              gh cache delete --all --ref "refs/pull/${pr}/merge" --succeed-on-no-caches
              remaining=$(gh cache list --limit 1000 --ref "refs/pull/${pr}/merge" --json id --jq 'length')
              echo "PR ${pr}: ${remaining} caches remain (should be zero) for refs/pull/${pr}/merge"
            else
              echo "PR ${pr} is ${state}: keeping caches"
            fi
          done
          echo "Total caches remaining (including non-PR): $(gh cache list --limit 1000 --json id --jq 'length')"
