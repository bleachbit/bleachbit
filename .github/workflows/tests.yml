name: Tests

on:
  push:
    branches:
      - '**'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    tags:
      - 'v*' # the release build in build_and_test.yaml runs on tags too
    paths-ignore: &paths-ignore
      - '.gitignore'
      - '.gitattributes'
      - 'bleachbit.png'
      - 'bleachbit.svg'
      - 'bleachbit.spec'
      - 'COPYING'
      - 'debian/**'
      - 'doc/**'
      - 'docker/**'
      - 'MANIFEST.in'
      - 'org.bleachbit.BleachBit.desktop'
      - 'org.bleachbit.BleachBit.metainfo.xml'
      - 'org.bleachbit.policy'
      - 'po/*.po' # translation strings
      - 'po/*.pot' # translation template
      - 'README.md'
      - 'windows/NsisInclude/NsisMultiUserLang.nsh' # translation strings only
  pull_request:
    branches:
      - '**'
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs and feature branches, but let master and
  # tags finish so their coverage reaches Coveralls.
  cancel-in-progress: ${{ github.ref_name != 'master' && github.ref_type != 'tag' }}

# Each Ubuntu image is paired with a Python version that is as close to
# "natural" (the image's pre-installed system Python) as possible, while still
# covering the range 3.9 to 3.15:
#   ubuntu-22.04 natural Python 3.10, tested 3.9  (older, via setup-python)
#   ubuntu-24.04 natural Python 3.12, tested 3.12 (natural, system venv)
#   ubuntu-26.04 natural Python 3.14, tested 3.14 (natural, system venv)
#   ubuntu-26.04 natural Python 3.14, tested 3.15 (newer, via setup-python)
# The "natural" entries skip actions/setup-python and use the system Python
# through a virtualenv: because Ubuntu 24.04+ enforces PEP 668, not allowing
# override system packages.
jobs:
  linux:
    name: linux (${{ matrix.python-version }})
    runs-on: ${{ matrix.ubuntu-version }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            ubuntu-version: ubuntu-22.04
            python-extra-dep: ''
            pygobject-version: '<3.51.0'
            use-setup-python: true
          - python-version: '3.12'
            ubuntu-version: ubuntu-24.04
            python-extra-dep: 'libgirepository-2.0-dev python3-gi python3-gi-cairo'
            pygobject-version: ''
            use-setup-python: false
          - python-version: '3.14'
            ubuntu-version: ubuntu-26.04
            python-extra-dep: 'libgirepository-2.0-dev python3-gi python3-gi-cairo'
            pygobject-version: ''
            use-setup-python: false
          - python-version: '3.15'
            ubuntu-version: ubuntu-26.04
            python-extra-dep: 'libgirepository-2.0-dev'
            pygobject-version: '>=3.51.0'
            use-setup-python: true

    env:
      COVERAGE: "coverage run"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            dbus \
            dbus-x11 \
            gettext \
            gir1.2-gtk-3.0 \
            gir1.2-notify-0.7 \
            gnome-keyring \
            libcairo2-dev \
            libgirepository1.0-dev \
            libnotify-bin \
            libxml2-utils \
            notification-daemon \
            p7zip-full \
            python3-venv \
            xvfb \
            ${{ matrix.python-extra-dep }}
          # for tests.TestLanguage
          sudo locale-gen es_ES.UTF-8
          sudo locale-gen pl_PL.UTF-8
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ matrix.use-setup-python }}
        # zizmor: ignore[cache-poisoning] test-only job, nothing cached here is published
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Use system Python ${{ matrix.python-version }} via virtualenv
        if: ${{ !matrix.use-setup-python }}
        run: |
          # --system-site-packages so the apt python3-gi is visible: without it
          # is_gtk_available() is False and every GTK test silently skips
          python3 -m venv --system-site-packages "$HOME/venv"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Cache pip packages
        if: ${{ !matrix.use-setup-python }}
        # zizmor: ignore[cache-poisoning] test-only job, nothing cached here is published
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ matrix.ubuntu-version }}-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
          restore-keys: pip-linux-${{ matrix.ubuntu-version }}-

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          if [[ "${{ matrix.pygobject-version }}" != "" ]]; then
            pip install "PyGObject${{ matrix.pygobject-version }}"
          fi

      - name: Generate Revision.py
        uses: $/.github/actions/generate-revision

      - name: Generate translations
        run: make -C po local

      - name: Mount test ISO read-only
        run: ./scripts/mount_test_iso.sh

      - name: Run tests (regular and sudo)
        timeout-minutes: 20
        env:
          # `tests-pytest` collects coverage only when this is non-empty
          PYTEST_COVERAGE: ${{ matrix.python-version == '3.14' && '1' || '' }}
        run: |
          export DISPLAY=":1.0"
          export $(dbus-launch)
          sudo Xvfb :1 -screen 0 800x600x24 &
          sleep 5
          if [[ "${{ matrix.python-version }}" == "3.9" ]]; then
            suite="make -C po tests && make tests-pytest && make tests-nsis"
          elif [[ "${{ matrix.python-version }}" == "3.12" || "${{ matrix.python-version }}" == "3.15" ]]; then
            suite="make tests-pytest"
          else
            suite="make -C cleaners tests && make tests-pytest && make tests-nsis && make tests-with-sudo"
          fi
          dbus-run-session -- bash -c "/usr/lib/notification-daemon/notification-daemon & sleep 2 && xvfb-run -a bash -c '$suite'"

      - name: Generate lcov coverage
        if: matrix.python-version == '3.14' && github.repository == 'bleachbit/bleachbit'
        run: |
          coverage report
          coverage lcov -o coverage.lcov

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.14' && github.repository == 'bleachbit/bleachbit'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.lcov
          flag-name: linux
          parallel: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  windows-test:
    name: windows-test
    timeout-minutes: 30
    runs-on: windows-latest

    env:
      PYTHON_HOME: ${{ github.workspace }}\vcpkg_installed\x86-windows\tools\python3
      PYTHON_EXE: ${{ github.workspace }}\vcpkg_installed\x86-windows\tools\python3\python.exe
      MSYS_BIN: C:\msys64\usr\bin
      PIP_CACHE_DIR: ${{ github.workspace }}\.pip-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the installed environment
        # zizmor: ignore[cache-poisoning] test-only job, windows-deploy ships windows-build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache the downloaded archives AND the unpacked+pip-installed tree, so
          # a warm run skips both the slow Expand-Archive and the pip installs.
          # No restore-keys: a partial-key hit would restore a tree with stale
          # dependencies that the install script would then skip re-installing.
          # This job doesn't mutate the tree, so caching it here is safe.
          path: |
            gtk*-x86-windows.7z
            gtk-themes.zip
            pygobject-*-win32.whl
            vcpkg_installed
          key: win-test-env-${{ hashFiles('.github/workflows/tests.yml', 'windows/python-gtk3-deps.lst', 'windows/python-gtk3-install.ps1', 'requirements.txt', 'windows/requirements.txt', 'requirements-test.txt') }}

      - name: Cache pip packages
        # zizmor: ignore[cache-poisoning] test-only job, windows-deploy ships windows-build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.pip-cache
          # This job installs requirements.txt + windows/requirements.txt
          # + requirements-test.txt, so the cache key includes all three.
          key: pip-win-test-${{ hashFiles('requirements.txt', 'windows/requirements.txt', 'requirements-test.txt') }}
          restore-keys: pip-win-

      - name: Install Python and GTK
        shell: pwsh
        run: .\windows\python-gtk3-install.ps1

      - name: Install PsExec
        shell: pwsh
        run: choco install psexec --version=2.43 -y

      - name: Generate Revision.py
        uses: $/.github/actions/generate-revision

      - name: Generate translations
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: |
          set PATH=%MSYS_BIN%;%PATH%
          make PYTHON="%PYTHON_EXE%" -C po local

      - name: Install test dependencies
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: '"%PYTHON_HOME%\Scripts\pip3.exe" install --disable-pip-version-check -r requirements-test.txt'

      - name: Mount virtual CD-ROM for testing
        shell: pwsh
        run: .\scripts\mount_test_iso.ps1

      # Suites run as separate steps (not a matrix); ids let the coverage
      # steps below check each suite's outcome before reporting.
      - name: Run admin tests
        id: admin
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        env:
          DESTRUCTIVE_TESTS: T
          PYTHONWARNINGS: error
          COVERAGE_FILE: .coverage.admin
        run: |
          set PATH=%MSYS_BIN%;C:\ProgramData\chocolatey\bin;C:\Windows\system32;C:\Windows;C:\Windows\system32\wbem;C:\Windows\SysWOW64\WindowsPowerShell\v1.0\;%PATH%
          make tests-pytest PYTHON="%PYTHON_EXE%" PYTEST_COVERAGE=1 PYTEST_ARGS=tests

      - name: Run non-admin tests
        id: nonadmin
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: |
          set PATH=%MSYS_BIN%;C:\ProgramData\chocolatey\bin;C:\Windows\system32;C:\Windows;C:\Windows\system32\wbem;C:\Windows\SysWOW64\WindowsPowerShell\v1.0\
          call windows\run-psexec-nonadmin-tests.bat

      - name: Run low-integrity tests
        id: lowintegrity
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: |
          set PATH=%MSYS_BIN%;C:\ProgramData\chocolatey\bin;C:\Windows\system32;C:\Windows;C:\Windows\system32\wbem;C:\Windows\SysWOW64\WindowsPowerShell\v1.0\
          call windows\run-psexec-low-integrity-tests.bat

      - name: Collect low-integrity coverage
        if: github.repository == 'bleachbit/bleachbit'
        shell: cmd # zizmor: ignore[misfeature] this step's script is written in cmd/batch syntax
        run: copy /Y "%USERPROFILE%\AppData\LocalLow\.coverage.psexec" .coverage.psexec

      - name: Combine coverage
        if: &all_suites_passed steps.admin.outcome == 'success' && steps.nonadmin.outcome == 'success' && steps.lowintegrity.outcome == 'success' && github.repository == 'bleachbit/bleachbit'
        shell: pwsh
        run: |
          Get-ChildItem .coverage* -Force -ErrorAction SilentlyContinue | Format-Table Name, Length
          $files = @('.coverage.admin', '.coverage.nonadmin', '.coverage.psexec') |
            Where-Object { Test-Path $_ }
          if ($files.Count -eq 0) {
            Write-Host "::error::No coverage files found"
            exit 1
          }
          & $env:PYTHON_EXE -m coverage combine --data-file=.coverage @files
          & $env:PYTHON_EXE -m coverage report --data-file=.coverage

      - name: Generate lcov coverage
        if: *all_suites_passed
        shell: pwsh
        run: "& $env:PYTHON_EXE -m coverage lcov -o coverage.lcov --data-file=.coverage"

      - name: Upload coverage to Coveralls
        if: *all_suites_passed
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.lcov
          flag-name: windows
          parallel: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # GitHub charges much more for macOS runner than Linux or Windows, so be
  # careful to manage costs
  #
  # References
  #  - https://docs.github.com/en/billing/reference/actions-runner-pricing
  #  - https://docs.github.com/en/actions/reference/runners/github-hosted-runners
  #
  # Headless tests on macOS. GTK is not installed, so GUI tests
  # auto-skip via @unittest.skipUnless(HAVE_GTK, ...).
  macos:
    name: macos (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        # zizmor: ignore[cache-poisoning] test-only job, nothing cached here is published
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: make install-deps-dev INSTALL_DEPS_ARGS=--venv

      - name: Generate Revision.py
        uses: $/.github/actions/generate-revision

      - name: Generate translations
        run: make -C po local PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Smoke test (CLI --version and --list)
        run: |
          .venv/bin/python bleachbit.py --version
          # A pipe into head would hide the exit status of --list
          .venv/bin/python bleachbit.py --list > "$RUNNER_TEMP/cleaners.txt"
          head -n 20 "$RUNNER_TEMP/cleaners.txt"

      - name: Validate cleaner XML
        run: make -C cleaners tests

      - name: Run tests
        env:
          PYTHONWARNINGS: error
        run: |
          touch ~/.zshrc # for test_expanduser
          make tests-pytest tests-nsis PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"

  coveralls-finish:
    needs: [linux, windows-test]
    if: github.repository == 'bleachbit/bleachbit'
    # This took 11s on ubuntu-slim (2026-07-27).
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
          carryforward: "linux,windows"
          github-token: ${{ secrets.GITHUB_TOKEN }}
