# GitHub charges much more for macOS runner than Linux or Windows, so be
# careful to manage costs
#
# References
#  - https://docs.github.com/en/billing/reference/actions-runner-pricing
#  - https://docs.github.com/en/actions/reference/runners/github-hosted-runners
#
name: Run tests on macOS

on:
  push:
    branches:
      - '**'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    paths:
      - '**'
      - '!bleachbit.spec'
      - '!debian/**'
      - '!doc/**'
      - '!po/**'
      - 'po/Makefile'
      - '!README.md'
      - '!windows/**'
  pull_request:
    paths:
      - '**'
      - '!bleachbit.spec'
      - '!debian/**'
      - '!doc/**'
      - '!po/**'
      - 'po/Makefile'
      - '!README.md'
      - '!windows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Headless tests on macOS. GTK is not installed, so GUI tests
# auto-skip via @unittest.skipUnless(HAVE_GTK, ...).
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gettext (Homebrew)
        run: |
          brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: make install-deps-dev INSTALL_DEPS_ARGS=--venv

      - name: Generate Revision.py
        uses: $/.github/actions/generate-revision

      - name: Generate translations
        run: make -C po local PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Smoke test (CLI --version and --list)
        run: |
          .venv/bin/python bleachbit.py --version
          .venv/bin/python bleachbit.py --list | head -n 20

      - name: Validate cleaner XML
        run: make -C cleaners tests

      - name: Run tests
        env:
          PYTHONWARNINGS: error
        run: |
          touch ~/.zshrc # for test_expanduser
          make tests-pytest tests-nsis PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
